[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleicao2026"
version = "0.1.0"
description = "Projeção do 1º e 2º turno da eleição presidencial brasileira de 2026 a partir da apuração do TSE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bernardo (berndof)" }]
# O núcleo do modelo usa só a biblioteca padrão; numpy/matplotlib são necessários apenas para os gráficos.
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
